version: '3.9'

services:
  postgres:
    container_name: sql-functions-postgres
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg14
    expose:
      - 5432
    command: postgres -c 'max_connections=500' # Tests seems to create a lots of connections, leading to errors TODO: investigate
    ports:
      - 35432:5432
    env_file: .env
